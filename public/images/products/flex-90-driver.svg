<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" fill="#0e1014"/>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" stroke="#1e222b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#grid)"/>
  <rect x="40" y="40" width="720" height="520" rx="16" stroke="#262a34" stroke-width="1.5" fill="#121418" fill-opacity="0.82"/>
  <text x="72" y="84" fill="#9ca3af" font-family="monospace" font-size="13" letter-spacing="2">MECA LAB // ATELIER // RENVOI D'ANGLE 90°</text>
  <line x1="72" y1="104" x2="728" y2="104" stroke="#262a34" stroke-width="1"/>

  <!-- Wooden Cabinet Obstruction -->
  <path d="M 140 160 H 460 V 210 H 190 V 450 H 140 Z" fill="#1a1d24" stroke="#374151" stroke-width="2"/>
  <text x="300" y="190" text-anchor="middle" fill="#6b7280" font-family="monospace" font-size="12">PAROI / CAISSON ETROIT</text>

  <!-- Flexible Torsion Shaft -->
  <path d="M 595 290 C 595 430 430 450 325 360" stroke="#2b303b" stroke-width="26" stroke-linecap="round"/>
  <path d="M 595 290 C 595 430 430 450 325 360" stroke="#f59e0b" stroke-opacity="0.65" stroke-width="3" stroke-dasharray="5 9" stroke-linecap="round"/>

  <!-- Hex Input -->
  <rect x="577" y="210" width="36" height="80" rx="6" fill="#272c36" stroke="#9ca3af" stroke-width="2"/>
  <rect x="587" y="175" width="16" height="35" rx="3" fill="#f59e0b"/>
  <text x="595" y="155" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="12">EMBOUT 1/4"</text>

  <!-- 90-Degree Metal Gearbox Head -->
  <rect x="245" y="275" width="90" height="100" rx="14" fill="#1f242d" stroke="#9ca3af" stroke-width="2.5"/>
  <rect x="208" y="302" width="37" height="44" rx="6" fill="#f59e0b" fill-opacity="0.24" stroke="#f59e0b" stroke-width="2"/>
  <!-- Stabilizer Handle -->
  <rect x="275" y="205" width="30" height="70" rx="8" fill="#16181d" stroke="#4b5563" stroke-width="2"/>

  <!-- Screw Axis Indicator -->
  <line x1="192" y1="324" x2="225" y2="324" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="415" y="505" text-anchor="middle" fill="#e5e7eb" font-family="monospace" font-size="13">CARTER ACIER 90° + GAINE TORSION SOUPLE</text>
</svg>
